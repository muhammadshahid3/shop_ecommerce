name: Laravel Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/shop-app:latest .

      - name: Push Image Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/shop-app:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            if [ ! -d "/home/ubuntu/shop" ]; then
              cd /home/ubuntu
              git clone https://github.com/muhammadshahid3/shop_ecommerce.git shop
            fi

            cd /home/ubuntu/shop
            git pull origin main

            sudo docker stop laravel10-app || true
            sudo docker rm laravel10-app || true

            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/shop-app:latest
            sudo docker compose up -d
            sudo docker image prune -f
