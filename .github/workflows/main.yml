name: Laravel Docker CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-push-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/shop-app:latest .


    - name: Push Image Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/shop-app:latest



    - name: Deploy on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}

        script: |

          cd ~/shop

          docker stop laravel10-app || true

          docker rm laravel10-app || true


          docker pull ${{ secrets.DOCKER_USERNAME }}/shop-app:latest


          docker compose up -d

          docker image prune -f
